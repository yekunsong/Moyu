name: CI

# `claude plugin validate` and `claude plugin test` need the Claude Code CLI,
# which this repository does not assume on a hosted runner; they stay manual
# (see CONTRIBUTING.md). This workflow covers the checks that need no engine
# login: the TypeScript build and the bridge suite against real Chrome.

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed, so `npm ci` cannot run.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Chrome is preinstalled on the runner, but not always on PATH. Pin the
      # executable via TRANSOM_CHROME, which bridge/paths.mjs checks first.
      - name: Locate Chrome
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($chrome) {
            "TRANSOM_CHROME=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "chrome.exe not found in the usual locations; bridge discovery will fall back to its own candidates."
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Bridge tests
        run: npm run test:bridge
