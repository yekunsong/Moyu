name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      # The hooks API and `claude plugin` live in the Claude Code CLI. Pin the
      # version so a newer CLI cannot break CI silently. No login is needed:
      # validate and test run locally.
      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.322

      - name: Typecheck
        run: npm run typecheck

      - name: Validate the plugin
        run: npm run validate

      - name: Plugin tests
        run: npm run test:plugin
