<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Embedded frame</title></head>
<body style="font:14px system-ui;margin:10px 14px">
  <p>Same-origin frame: its nodes are reachable from the parent document only through <code>contentDocument</code>.</p>
  <button id="frame-button">Frame button</button>
  <output id="frame-out"></output>
  <script>
    document.getElementById('frame-button').onclick = () => {
      document.getElementById('frame-out').textContent = ' frame pressed at ' + new Date().toISOString()
    }
  </script>
</body>
</html>
