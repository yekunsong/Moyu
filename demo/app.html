<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Transom demo</title>
  <style>
    :root { --ink: #1d232b; --line: #d5dbe3; --accent: #b44a1a; }
    * { box-sizing: border-box; }
    body { font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--ink); margin: 0 auto; max-width: 760px; padding: 20px 24px 80px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: #667080; margin: 28px 0 8px; }
    p.lede { color: #55606e; margin: 0 0 20px; }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 0 0 12px; }
    button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    input, textarea, select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; width: 100%; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row input { flex: 1; }
    ul.todo { list-style: none; padding: 0; margin: 0; }
    ul.todo li { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    ul.todo li.done label { text-decoration: line-through; color: #8a94a2; }
    ul.todo input[type=checkbox] { width: auto; }
    #status { font-size: 13px; color: var(--accent); min-height: 20px; }
    .long { height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
    canvas { border: 1px solid var(--line); border-radius: 8px; width: 100%; height: 120px; }
    iframe { border: 1px solid var(--line); border-radius: 8px; width: 100%; height: 90px; }
  </style>
</head>
<body>
  <h1>Transom demo app</h1>
  <p class="lede">A small surface for exercising snapshot and act: counter, form, list, canvas, shadow DOM, iframe and a long scroller. <a href="/frame.html">Frame page</a></p>

  <h2>Counter</h2>
  <div class="card row">
    <button id="dec" aria-label="Decrease count">−</button>
    <output id="count" role="status" aria-live="polite">0</output>
    <button id="inc" class="primary" aria-label="Increase count">+</button>
    <span id="status"></span>
    <button id="alert" aria-label="Show alert">Show alert</button>
    <button id="later" aria-label="Append later">Append later</button>
    <span id="later-host"></span>
  </div>

  <h2>Form</h2>
  <div class="card">
    <form id="signup">
      <div class="row" style="margin-bottom:8px">
        <input name="email" type="email" placeholder="you@example.com" aria-label="Email" required />
        <input name="password" type="password" placeholder="Password" aria-label="Password" required />
        <input name="pin" type="PASSWORD" aria-label="PIN" placeholder="PIN" />
        <input name="bare" type="password" />
      </div>
      <div class="row">
        <select name="plan" aria-label="Plan">
          <option value="free">Free</option>
          <option value="team">Team</option>
          <option value="enterprise">Enterprise</option>
        </select>
        <button type="submit" class="primary">Sign up</button>
      </div>
      <p id="form-note" style="margin:8px 0 0;font-size:13px"></p>
    </form>
  </div>

  <h2>Todo</h2>
  <div class="card">
    <form id="add">
      <div class="row">
        <input name="title" aria-label="New todo" placeholder="What needs doing?" />
        <button type="submit">Add</button>
      </div>
    </form>
    <ul class="todo" id="todos"></ul>
  </div>

  <h2>Overlay</h2>
  <div class="card" style="position:relative;min-height:44px">
    <button id="pay">Pay $500</button>
    <div id="cover" aria-label="Overlay" style="position:absolute;inset:0;background:rgba(180,74,26,.12);z-index:1"></div>
  </div>

  <h2>Canvas</h2>
  <canvas id="art" width="720" height="120" aria-label="Canvas demo"></canvas>

  <h2>Shadow DOM</h2>
  <div id="shadow-host"></div>

  <h2>Iframe</h2>
  <iframe src="/frame.html" title="Embedded frame" loading="eager"></iframe>

  <h2>Long scroller</h2>
  <div class="long" id="long"></div>

  <script>
    const countEl = document.getElementById('count')
    const statusEl = document.getElementById('status')
    let count = 0
    const render = () => { countEl.textContent = String(count) }
    document.getElementById('inc').onclick = () => { count += 1; render(); statusEl.textContent = 'increased' }
    document.getElementById('dec').onclick = () => { count -= 1; render(); statusEl.textContent = 'decreased' }

    document.getElementById('alert').addEventListener('click', () => alert('demo alert'))
    document.getElementById('later').addEventListener('click', () => {
      setTimeout(() => {
        const node = document.createElement('p')
        node.id = 'later-node'
        node.textContent = 'later'
        document.getElementById('later-host').append(node)
      }, 400)
    })

    document.getElementById('signup').addEventListener('submit', event => {
      event.preventDefault()
      const data = new FormData(event.target)
      document.getElementById('form-note').textContent =
        `Submitted ${data.get('email')} on the ${data.get('plan')} plan (password length ${String(data.get('password')).length}).`
    })

    const todos = document.getElementById('todos')
    let todoId = 0
    document.getElementById('add').addEventListener('submit', event => {
      event.preventDefault()
      const input = event.target.elements.title
      const title = input.value.trim()
      if (!title) return
      todoId += 1
      const li = document.createElement('li')
      li.dataset.id = String(todoId)
      const checkbox = document.createElement('input')
      checkbox.type = 'checkbox'
      checkbox.setAttribute('aria-label', `Done: ${title}`)
      checkbox.addEventListener('change', () => li.classList.toggle('done', checkbox.checked))
      const label = document.createElement('label')
      label.textContent = title
      const remove = document.createElement('button')
      remove.type = 'button'
      remove.textContent = 'Remove'
      remove.setAttribute('aria-label', `Remove ${title}`)
      remove.addEventListener('click', () => li.remove())
      li.append(checkbox, label, remove)
      todos.append(li)
      input.value = ''
    })

    const art = document.getElementById('art')
    const context = art.getContext('2d')
    context.fillStyle = '#f4ede6'
    context.fillRect(0, 0, art.width, art.height)
    for (let i = 0; i < 40; i += 1) {
      context.fillStyle = `hsl(${i * 9}, 65%, 45%)`
      context.beginPath()
      context.arc(20 + i * 18, 60 + Math.sin(i / 3) * 30, 7, 0, Math.PI * 2)
      context.fill()
    }

    const host = document.getElementById('shadow-host')
    const shadow = host.attachShadow({ mode: 'open' })
    shadow.innerHTML = `
      <style>.c{font:14px system-ui;border:1px solid #d5dbe3;border-radius:8px;padding:10px 14px;display:flex;gap:8px;align-items:center}</style>
      <div class="c"><span>Shadow counter:</span><button id="s">0</button><span>clicks</span></div>`
    let shadowCount = 0
    shadow.getElementById('s').addEventListener('click', event => {
      shadowCount += 1
      event.target.textContent = String(shadowCount)
    })

    const long = document.getElementById('long')
    for (let i = 1; i <= 60; i += 1) {
      const p = document.createElement('p')
      p.textContent = `Row ${i}: the quick brown fox jumps over the lazy dog.`
      long.append(p)
    }
  </script>
</body>
</html>
